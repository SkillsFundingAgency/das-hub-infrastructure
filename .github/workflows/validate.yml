name: Validate

# Rule and template mistakes currently surface halfway through a 15 minute
# deployment, after the firewall has already started committing changes.
# Catch them on the pull request instead.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate JSON syntax
        run: |
          shopt -s globstar
          failed=0
          for file in **/*.json; do
            if ! python -m json.tool "$file" > /dev/null 2>&1; then
              echo "::error file=$file::invalid JSON"
              failed=1
            fi
          done
          exit $failed

      - name: Validate firewall rule configs
        run: python scripts/validate-firewall-rules.py

      - name: Check linked template URIs resolve
        run: |
          # hub.template.json fetches these at deploy time. A renamed or missing
          # template only fails once the deployment is already running.
          failed=0
          for template in $(python -c "
          import json, re
          doc = json.load(open('config/hub.template.json'))
          uris = set()
          for resource in doc['resources']:
              uri = resource.get('properties', {}).get('templateLink', {}).get('uri', '')
              match = re.search(r\"'(templates/[^']+)'\", uri)
              if match:
                  uris.add(match.group(1))
          print('\n'.join(sorted(uris)))
          "); do
            if [ ! -f "$template" ]; then
              echo "::error::hub.template.json links $template, which does not exist"
              failed=1
            fi
          done
          exit $failed

      - name: Shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck scripts/*.sh
