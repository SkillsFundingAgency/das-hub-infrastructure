parameters:
  - name: Environment
    type: string
  - name: ServiceConnection
    type: string
  # A full run is the firewall idle guard (up to 30 minutes) plus a serialised
  # rule collection group deployment (12-15 minutes), so the 60 minute default
  # is uncomfortably tight.
  - name: TimeoutInMinutes
    type: number
    default: 90

jobs:
- deployment: DeployHub
  displayName: 'Deploy ARM Template to ${{ parameters.Environment }}'
  environment: ${{ parameters.Environment }}
  timeoutInMinutes: ${{ parameters.TimeoutInMinutes }}
  strategy:
    runOnce:
      deploy:
        steps:
        - checkout: self
        - template: azure-pipelines-templates/deploy/step/arm-deploy.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            SubscriptionId: $(SubscriptionId)
            Location: $(location)
            Environment: ${{ parameters.Environment }}
            TemplatePath: $(Pipeline.Workspace)/drop/azure/hub.template.json
            ParametersPath: $(Pipeline.Workspace)/drop/azure/hub.template.parameters.json
            IsMultiRepoCheckout: true
