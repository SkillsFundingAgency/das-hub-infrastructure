trigger:
  batch: true
  branches:
    include:
      - "main"

variables:
- name: BuildConfiguration
  value: release
- name: BuildPlatform
- group: RELEASE das-hub-infrastructure
- name: Deploy
  value: $[or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'Manual'), eq(variables['Build.Reason'], 'PullRequest'))]

resources:
  repositories:
  - repository: self

stages:
- stage: Build
  displayName: 'Build and Validate'
  jobs:
  - template: pipeline-templates/job/build.yml

- stage: Deploy_DTA
  dependsOn: Build
  displayName: 'Deploy to DTA'
  variables:
  - group: DTA das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: DTA
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_AT
  dependsOn: Deploy_DTA
  displayName: 'Deploy to AT'
  variables:
  - group: AT das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: AT
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_TEST
  dependsOn: Deploy_DTA
  displayName: 'Deploy to TEST'
  variables:
  - group: TEST das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: TEST
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_TEST2
  dependsOn: Deploy_DTA
  displayName: 'Deploy to TEST2'
  variables:
  - group: TEST2 das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: TEST2
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_DEMO
  dependsOn: Deploy_DTA
  displayName: 'Deploy to DEMO'
  variables:
  - group: DEMO das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: DEMO
      ServiceConnection: SFA-DAS-DevTest-ARM

- stage: Deploy_PP
  dependsOn: Deploy_DTA
  displayName: 'Deploy to PP'
  variables:
  - group: PP das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: PREPROD
      ServiceConnection: SFA-DIG-PreProd-ARM

