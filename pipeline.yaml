trigger: none

pr: none

resources:
  repositories:
  - repository: self

pool:
  vmImage: 'ubuntu-latest'

stages:
# Validate once, up front. Every deploy stage hangs off this, so a bad rule
# file fails in seconds rather than part way through a 15 minute firewall
# update in the first environment.
- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: ValidateConfig
    displayName: 'Validate firewall rule configuration'
    steps:
    - checkout: self
      displayName: 'Checkout Repository'

    - script: python3 scripts/validate-firewall-rules.py
      displayName: 'Validate firewall rule files'

- stage: Deploy_DTA
  dependsOn: Validate
  displayName: 'Deploy to DTA'
  variables:
  - group: DTA das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: DTA
      ServiceConnection: SFA-DAS-DevTest-ARM
      RulesFile: config/CDS-FwRules/firewall_rules_dta.json
      # DTA's live rule collection groups predate the naming used everywhere
      # else, so it overrides all three rather than taking the shared values.
      NetworkGroupName: NetworkGroup
      AppGroupName: AppGroup
      DnatGroupName: DNAT-Rules

- stage: Deploy_AT
  dependsOn: Validate
  displayName: 'Deploy to AT'
  variables:
  - group: AT das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: AT
      ServiceConnection: SFA-DAS-DevTest-ARM
      RulesFile: config/CDS-FwRules/firewall_rules_at.json

- stage: Deploy_TEST
  dependsOn: Validate
  displayName: 'Deploy to TEST'
  variables:
  - group: TEST das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: TEST
      ServiceConnection: SFA-DAS-DevTest-ARM
      RulesFile: config/CDS-FwRules/firewall_rules_test.json

- stage: Deploy_TEST2
  dependsOn: Validate
  displayName: 'Deploy to TEST2'
  variables:
  - group: TEST2 das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: TEST2
      ServiceConnection: SFA-DAS-DevTest-ARM
      RulesFile: config/CDS-FwRules/firewall_rules_test2.json

- stage: Deploy_DEMO
  dependsOn: Validate
  displayName: 'Deploy to DEMO'
  variables:
  - group: DEMO das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: DEMO
      ServiceConnection: SFA-DAS-DevTest-ARM
      RulesFile: config/CDS-FwRules/firewall_rules_demo.json

- stage: Deploy_PP
  dependsOn: Validate
  displayName: 'Deploy to PP'
  variables:
  - group: PP das-hub-infrastructure
  jobs:
  - template: pipeline-templates/job/deploy-hub.yml
    parameters:
      Environment: PREPROD
      ServiceConnection: SFA-DIG-PreProd-ARM
      RulesFile: config/FCS-FwRules/firewall_rules_pp.json
      EnvironmentTag: 'Pre-Production'

